name: Release

# Push a tag such as v0.2.0 to release. A tag with "alpha" or "beta" in it makes an alpha or beta file.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to make the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uploads to each site whose ID is in the TOC and whose token is set. Others are skipped.
      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
