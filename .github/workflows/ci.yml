name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4

      # The game runs Lua 5.1, so check the addon with that compiler. The tests use Lua 5.4.
      - name: Check syntax with Lua 5.1
        run: find Superb -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run tests
        run: for t in tests/*_test.lua; do echo "== $t"; lua5.4 "$t"; done

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A dry run: builds the zip exactly as a release would, uploads nothing.
      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Superb
          path: .release/*.zip
